<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justify Items</title>
    <style>
        

        body {
            font-size: 1.2rem;
            background: black;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .grid {
            border: 5px solid red;
            height: 80vh;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(4, 100px);
            column-gap: 20px;
            row-gap: 20px;
            /* justify-items: stretch;  Alinha o conteúdo dentro da célula  no eixo do y*/
            align-items: end; /* Alinha o conteúdo dentro da célula  no eixo do x*/
        }

        .grid > div {
            border: 5px solid yellowgreen;
        }
    </style>
</head>

<body>

    <div class="grid">
        <div class="item1">01</div>
        <div class="item2">02</div>
        <div class="item3">03</div>
        <div class="item4">04</div>
        <div class="item5">05</div>
        <div class="item6">06</div>
        <div class="item7">07</div>
        <div class="item8">08</div>
        <div class="item9">09</div>
        <div class="item10">10</div>
        <div class="item11">11</div>
        <div class="item12">12</div>
    </div>

</body>

</html>
